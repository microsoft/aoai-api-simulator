name: ci-test

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0 # get all branches so that we can check out main to compare lint scores

    - name: Run make ci-build in dev container
      uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
      with:    
        # TODO - cache dev container image
        push: never
        env: |
          GITHUB_BASE_REF
        runCmd: |
          echo -e "Running ci-build for ref:$GITHUB_BASE_REF\n\n"
          make install-requirements

          echo -e "\n\n------------------------------  version  --------------------------------------------------\n\n"
          python --version
          pip freeze

          echo -e "\n\n------------------------------  lint     --------------------------------------------------\n\n"
          ./scripts/ci-lint.sh

          echo -e "\n\n------------------------------  test     --------------------------------------------------\n\n"
          make test


